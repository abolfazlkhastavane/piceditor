<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DrNote | استودیوی تصویر پزشکی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f172a;--card:#1e293b;--soft:#172033;--line:#334155;--ac:#14b8a6;--ac2:#0f766e;--tx:#e2e8f0;--mu:#94a3b8;--hl:#e3b86b;--ck1:#2a3548;--ck2:#222c3d}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font:14px/1.6 Vazirmatn,Tahoma,sans-serif}
button,input,select{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:16px;font-weight:800;margin:0 0 0 14px;color:var(--ac)}
.sp{flex:1}
.btn{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:4px 12px;cursor:pointer}
.btn:hover{border-color:var(--ac)}
.btn.pri{background:var(--ac2);border-color:var(--ac2);color:#fff;font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--hl);outline-offset:1px}
main{flex:1;display:grid;grid-template-columns:72px 1fr 330px;min-height:0}
#tools{background:var(--card);border-left:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:4px;overflow:auto}
#tools button{background:none;border:1px solid transparent;border-radius:8px;padding:4px 0;cursor:pointer;font-size:11px;color:var(--mu);line-height:1.3}
#tools button b{display:block;font-size:20px;font-weight:400;color:var(--tx)}
#tools button:hover{border-color:var(--line)}
#tools button.on{background:var(--ac2);color:#fff;border-color:var(--ac)}
#mid{display:flex;flex-direction:column;min-width:0;min-height:0}
#ctx{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 12px;background:var(--soft);border-bottom:1px solid var(--line);min-height:44px}
#ctx [hidden]{display:none!important}
#ctx input[type=text]{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 8px;width:170px}
.sw{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);padding:0;cursor:pointer}
#stage{flex:1;overflow:auto;display:flex;position:relative}
#wrap{margin:auto;position:relative;line-height:0;background:conic-gradient(var(--ck1) 25%,var(--ck2) 0 50%,var(--ck1) 0 75%,var(--ck2) 0) 0 0/16px 16px;box-shadow:0 8px 40px #0008}
#wrap canvas{display:block}
#ov{position:absolute;inset:0}
#empty[hidden]{display:none!important}
#empty{pointer-events:none;position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--mu);padding:20px}
#empty div{border:2px dashed var(--line);border-radius:16px;padding:40px 50px;max-width:460px}
#empty b{color:var(--tx);font-size:18px}
#st{padding:3px 12px;background:var(--card);border-top:1px solid var(--line);color:var(--mu);font-size:12px;display:flex;gap:14px}
aside{background:var(--card);border-right:1px solid var(--line);overflow:auto;display:flex;flex-direction:column}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1}
.tabs button{flex:1;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:3px 6px;cursor:pointer;font-size:13px;white-space:nowrap}
.tabs button.on{background:var(--ac2);border-color:var(--ac);color:#fff}
.pn{padding:4px 14px 16px}
.pn[hidden]{display:none}
label.r{display:grid;grid-template-columns:1fr auto;gap:0 8px;margin:10px 0}
label.r input{grid-column:1/3}
label.f{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0}
label.f input[type=text],label.f select,label.f input[type=number]{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 8px;width:60%}
label.k{display:flex;gap:8px;align-items:center;margin:10px 0}
output{color:var(--mu);font-size:12px}
input[type=range]{accent-color:var(--ac);width:100%}
input[type=checkbox]{accent-color:var(--ac)}
input[type=color]{width:44px;height:26px;border:none;background:none;padding:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.pf,.th{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.pf button,.th button{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:6px 3px;cursor:pointer;font-size:12px;line-height:1.4}
.pf button:hover,.th button:hover{border-color:var(--ac)}
.pf i{display:block;height:34px;width:46px;margin:2px auto 5px}
.th canvas{width:100%;border-radius:6px;display:block;margin-bottom:3px}
.pal{display:flex;gap:6px;margin:6px 0;min-height:20px;flex-wrap:wrap}
.tp{display:flex;gap:6px;align-items:center;margin:6px 0}.tp span{flex:1}
.g3{display:grid;grid-template-columns:repeat(3,34px);gap:4px;direction:ltr;margin:6px 0}
.g3 button{height:34px;border:1px solid var(--line);background:var(--soft);border-radius:6px;cursor:pointer}
.g3 button.on{background:var(--ac);border-color:var(--ac)}
h3{font-size:13px;color:var(--hl);margin:16px 0 4px;font-weight:600}
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--ac2);color:#fff;padding:8px 18px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none}
#toast.on{opacity:1}
html[data-theme=light]{--bg:#e2e8f0;--card:#fff;--soft:#f1f5f9;--line:#cbd5e1;--tx:#0f172a;--mu:#64748b;--ck1:#dbe2ec;--ck2:#eef2f7}
html[data-theme=sepia]{--bg:#efe8d8;--card:#fbf8f0;--soft:#f4eedf;--line:#d8ccb4;--tx:#3b3226;--mu:#8a7b63;--ck1:#e6dcc4;--ck2:#f1e9d6}
@media(max-width:860px){body{height:auto;min-height:100vh}main{grid-template-columns:1fr;grid-template-rows:auto 60vh auto}#tools{flex-direction:row;border:none;border-bottom:1px solid var(--line)}#tools button{min-width:58px}aside{border:none}}

/* DrNote visual refresh */
:root{--bg:#0b1220;--card:#121e30;--soft:#17263a;--line:#273b52;--ac:#42d6c0;--ac2:#087f79;--tx:#edf5fb;--mu:#9aadc1;--hl:#f3c879;--ck1:#26374b;--ck2:#1d2c40}
body{background:radial-gradient(ellipse at 50% -20%,#1c3650 0%,var(--bg) 56%);letter-spacing:.05px}
header{padding:11px 18px;gap:9px;background:rgba(18,30,48,.96);box-shadow:0 8px 28px #02081755;position:relative;z-index:3}
h1{display:flex;align-items:center;gap:9px;font-size:17px;color:#eafcf9;white-space:nowrap}
h1:before{content:'✚';display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,#43d7c0,#0a847d);color:#062c31;font-size:19px;box-shadow:0 5px 16px #14b8a644}
h1 small{font-size:12px;color:#9bb3c8;font-weight:600;border-right:1px solid var(--line);padding-right:10px;margin-right:1px}
.btn{background:linear-gradient(180deg,#1b2c42,#152438);border:1px solid #30465f;border-radius:10px;padding:6px 12px;transition:transform .15s,border-color .15s,background .15s;box-shadow:0 2px 7px #0002}
.btn:hover{border-color:var(--ac);transform:translateY(-1px)}
.btn.pri{background:linear-gradient(135deg,#0d9488,#08756f);border-color:#20b9a7;box-shadow:0 5px 16px #0d948833}
main{grid-template-columns:82px minmax(0,1fr) 360px;gap:0}
#tools{padding:10px 7px;gap:6px;background:rgba(18,30,48,.95);border-left:1px solid var(--line)}
#tools button{min-height:62px;border-radius:11px;padding:6px 2px;font-size:11px;transition:.15s}
#tools button b{font-size:21px;margin-bottom:2px}
#tools button:hover{background:#20364c;color:var(--tx);transform:translateY(-1px)}
#tools button.on{background:linear-gradient(145deg,#0c8279,#075b60);border-color:#42d6c0;box-shadow:0 4px 15px #0d948833}
#mid{background:#0a1422}
#ctx{padding:9px 14px;gap:12px;background:#111f31;border-bottom:1px solid var(--line);box-shadow:0 3px 12px #0002}
#ctx input[type=text],label.f input[type=text],label.f select,label.f input[type=number]{background:#0b1727;border:1px solid #31465e;border-radius:8px;padding:6px 9px}
#ctx input[type=text]{width:190px}
#stage{background:radial-gradient(ellipse at center,#17283d 0%,#0a1422 72%)}
#wrap{border:1px solid #39516a;border-radius:4px;overflow:hidden;box-shadow:0 18px 60px #0009}
#empty div{background:#14243a;border:1px dashed #4a6981;border-radius:18px;padding:38px 44px;box-shadow:0 12px 36px #0004}
#empty b{color:#f1fbff}
#st{background:#101d2d;border-top:1px solid #293d53;padding:6px 14px}
aside{background:rgba(18,30,48,.98);border-right:1px solid var(--line);box-shadow:-8px 0 28px #0002}
.tabs{padding:10px;gap:6px;background:rgba(18,30,48,.98);border-bottom:1px solid var(--line)}
.tabs button{padding:7px 5px;border-radius:9px;background:#17263a;border-color:#2a4058}
.tabs button.on{background:linear-gradient(135deg,#0d827a,#075d60);border-color:#37cdb9}
.pn{padding:8px 16px 20px}
label.r{margin:13px 0;gap:3px 8px}
label.f{margin:12px 0}
label.f input[type=text],label.f select,label.f input[type=number]{width:62%;color:var(--tx)}
.g2{gap:8px}
.pf button,.th button{background:#17283d;border-color:#2b4158;border-radius:12px;padding:8px 5px}
.pf button:hover,.th button:hover{border-color:var(--ac);background:#20364c}
.sw{width:22px;height:22px;border-color:#668098}
h3{font-size:13px;color:#7fe4d5;margin:20px 0 7px;padding-bottom:5px;border-bottom:1px solid #293e54}
#toast{background:#087f79;box-shadow:0 8px 28px #0006;border:1px solid #47cdb9}
input,select{accent-color:var(--ac)}
@media(max-width:1100px){main{grid-template-columns:70px minmax(0,1fr) 315px}header{padding:8px 10px}h1{font-size:14px}h1 small{display:none}}
@media(max-width:860px){body{height:auto;min-height:100vh}header{position:sticky;top:0}main{grid-template-columns:1fr;grid-template-rows:auto minmax(58vh,65vh) auto}#tools{flex-direction:row;overflow-x:auto;border:none;border-bottom:1px solid var(--line);padding:7px}#tools button{min-width:66px;min-height:56px}aside{border:none;border-top:1px solid var(--line)}#ctx{position:sticky;top:0;z-index:2}#stage{min-height:58vh}}

input[type=range]{accent-color:var(--ac)}

select option{background:#fff;color:#20323b}

<body>
<header>
  <h1>DrNote <small>استودیوی تصویر پزشکی</small></h1>
  <button class="btn" id="open">باز کردن تصویر</button>
  <input type="file" id="file" accept="image/*" hidden>
  <button class="btn" id="undo" disabled>واگرد</button>
  <button class="btn" id="redo" disabled>ازنو</button>
  <span class="sp"></span>
  <button class="btn" id="zo">−</button><button class="btn" id="zf">اندازه صفحه</button><button class="btn" id="z1">۱۰۰٪</button><button class="btn" id="zi">+</button>
  <button class="btn" id="thm">تم</button>
  <button class="btn" id="cmp" title="نگه دارید تا تصویر اصلی را ببینید">مقایسه با اصلی</button>
  <button class="btn pri" id="dl">دانلود تصویر</button>
</header>
<main>
  <nav id="tools" aria-label="ابزارها"></nav>
  <div id="mid">
    <div id="ctx">
      <span data-t="pen hl line arrow rect ell text callout measure redact mark mos blr spot lens" style="display:flex;gap:6px;align-items:center">
        <input type="color" id="col" value="#ef4444" aria-label="رنگ">
        <span id="sws" style="display:flex;gap:4px"></span>
        <span>اندازه</span><input type="range" id="sz" min="1" max="40" value="8" style="width:110px">
      </span>
      <label data-t="rect ell"><input type="checkbox" id="fill"> توپر</label>
      <span data-t="text callout" style="display:flex;gap:8px;align-items:center"><input type="text" id="txt" value="متن نمونه"><select id="tf" class="btn"><option>Vazirmatn</option><option>Tahoma</option><option>Georgia</option><option>Courier New</option><option>Impact</option></select><label><input type="checkbox" id="tbg" checked> پس‌زمینه متن</label></span>
      <button class="btn" data-t="mark" id="mk0">شماره‌گذاری از ۱</button>
      <span data-t="crop" style="display:flex;gap:8px;align-items:center">
        <select id="asp" class="btn"><option value="0">آزاد</option><option value="1">۱:۱</option><option value="1.3333">۴:۳</option><option value="1.7778">۱۶:۹</option><option value="0.75">۳:۴</option><option value="0.5625">۹:۱۶</option></select>
        <button class="btn pri" id="capply">اعمال برش</button><button class="btn" id="ccancel">انصراف</button><span id="cinfo"></span>
      </span>
    </div>
    <div id="stage">
      <div id="wrap"><canvas id="cv"></canvas><canvas id="ov"></canvas></div>
      <div id="empty"><div><b>تصویر آموزشی را اینجا رها کنید</b><p>برای شروع تصویر را باز کنید یا اینجا رها کنید. با Ctrl+V هم می‌توانید از کلیپ‌بورد بچسبانید.</p></div></div>
    </div>
    <div id="st"><span id="dim">—</span><span id="zl"></span></div>
  </div>
  <aside>
    <div class="tabs" id="tabs"></div>
    <div class="pn" id="p-adj"></div>
    <div class="pn" id="p-flt" hidden></div>
    <div class="pn" id="p-wm" hidden></div>
    <div class="pn" id="p-frm" hidden></div>
    <div class="pn" id="p-trn" hidden></div>
    <div class="pn" id="p-exp" hidden></div>
    <div class="pn" id="p-tpl" hidden></div>
  </aside>
</main>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const cv=$('#cv'),ov=$('#ov'),ox=ov.getContext('2d');

function wm(x,x0,y0,w,h){
 const img=W.type==='img';if(!W.on||(img&&!W.img)||(!img&&!W.text))return;

 if(img){ew=fs*4;eh=ew*W.img.height/W.img.width}else{x.font=`700 ${fs}px "${W.font}",Vazirmatn,Tahoma,sans-serif`;ew=x.measureText(W.text).width;eh=fs*1.2}
 const one=(px,py,r)=>{x.save();x.translate(px,py);x.rotate(r);if(W.shadow){x.shadowColor='rgba(0,0,0,.45)';x.shadowBlur=fs/6;x.shadowOffsetY=fs/20}
  if(img)x.drawImage(W.img,-ew/2,-eh/2,ew,eh);else{x.fillStyle=W.color;x.textAlign='center';x.textBaseline='middle';x.fillText(W.text,0,0)}x.restore()};
 const r=W.rot*Math.PI/180;
 if(W.tile){const D=Math.hypot(w,h),sx=ew*1.5,sy=eh*3;x.translate(x0+w/2,y0+h/2);x.rotate(r);let row=0;for(let yy=-D/2;yy<D/2;yy+=sy,row++)for(let xx=-D/2-(row%2)*sx/2;xx<D/2;xx+=sx)one(xx,yy,0)}
 else{const m=w*W.m/100,a=W.pos[0],b=W.pos[1];
  one(b=='l'?x0+m+ew/2:b=='c'?x0+w/2:x0+w-m-ew/2,a=='t'?y0+m+eh/2:a=='m'?y0+h/2:y0+h-m-eh/2,r)}

function sharp(src){if(!S.sh)return src;const k=src===base?ver+'|'+S.sh:null;if(k&&shC.k===k)return shC.c;

 for(let y=1;y<h-1;y++)for(let i=1;i<w-1;i++){const p=(y*w+i)*4;for(let c=0;c<3;c++){const q=p+c;d[q]=s[q]*(1+4*a)-a*(s[q-4]+s[q+4]+s[q-r]+s[q+r])}}

function fx(x,x0,y0,w,h){
 if(S.n){const k=Math.max(1,w/900);x.save();x.globalCompositeOperation='overlay';x.globalAlpha=S.n/100;x.translate(x0,y0);x.scale(k,k);x.fillStyle=x.createPattern(noise(),'repeat');x.fillRect(0,0,w/k,h/k);x.restore()}

 if(S.v){const g=x.createRadialGradient(x0+w/2,y0+h/2,Math.min(w,h)*.25,x0+w/2,y0+h/2,Math.hypot(w,h)/2);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${S.v/110})`);x.fillStyle=g;x.fillRect(x0,y0,w,h)}}
function draw(c,scale,src=base){
 const q=P(src),qb=QB(src),w=src.width,h=src.height,cw=w+2*q,ch=h+q+qb,lw=LW(src),p=q-lw,ow=Math.round(w*F.ow/1000),rr=Math.min(w,h)*F.rad/200,orr=Math.min(cw,ch)*F.orad/200;

 if(!collageFiles.length){toast('ابتدا ۱ تا ۴ تصویر انتخاب کنید');return}
 const files=[...collageFiles];
 Promise.all(files.map(f=>new Promise((resolve,reject)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);resolve(im)};im.onerror=()=>{URL.revokeObjectURL(u);reject(new Error('image'))};im.src=u}))).then(imgs=>{
  const cols=imgs.length===1?1:2,rows=Math.ceil(imgs.length/cols),cellW=1200,cellH=1050,gap=24,outer=42;
  const out=mkc(outer*2+cols*cellW+(cols-1)*gap,outer*2+rows*cellH+(rows-1)*gap),x=out.getContext('2d');
  x.fillStyle='#eaf0f4';x.fillRect(0,0,out.width,out.height);
  imgs.forEach((im,i)=>{const col=i%cols,row=Math.floor(i/cols),px=outer+col*(cellW+gap),py=outer+row*(cellH+gap);x.fillStyle='#fff';x.shadowColor='rgba(15,35,55,.16)';x.shadowBlur=20;x.shadowOffsetY=5;x.fillRect(px,py,cellW,cellH);x.shadowColor='transparent';x.shadowBlur=0;x.shadowOffsetY=0;x.strokeStyle='#d4e0e8';x.lineWidth=3;x.strokeRect(px+1.5,py+1.5,cellW-3,cellH-3);
   const pad=52,head=70,foot=35,availW=cellW-pad*2,availH=cellH-head-foot-pad,scale=Math.min(availW/im.width,availH/im.height),iw=im.width*scale,ih=im.height*scale,ix=px+(cellW-iw)/2,iy=py+head+(availH-ih)/2;
   x.fillStyle='#0b827a';x.beginPath();x.arc(px+48,py+47,25,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.font='700 26px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(String.fromCharCode(65+i),px+48,py+48);x.drawImage(im,ix,iy,iw,ih);
  });
  base=out;$('#empty').hidden=true;crop=null;commit();fit();toast('چیدمان چندتصویری ساخته شد؛ برای برگشت «واگرد» را بزنید');
 }).catch(()=>toast('خواندن یکی از تصاویر ناموفق بود'));
};

/* ---------- init ---------- */
$$('[data-fp]').forEach(b=>b.onclick=()=>{Object.assign(F,F0,FP[b.dataset.fp][1]);sync();fit()});
$('#frs').onclick=()=>{Object.assign(F,F0);sync();fit()};
$('#cmp').onpointerdown=()=>{orig=true;render()};['pointerup','pointerleave'].forEach(ev=>$('#cmp')['on'+ev]=()=>{if(orig){orig=false;render()}});
const TH=['light','dark','sepia'],TN={dark:'تیره',light:'روشن',sepia:'سپیا'};let ti=0;try{const saved=localStorage.getItem('khth-v2');if(saved&&TH.includes(saved))ti=TH.indexOf(saved)}catch(e){}
function setTh(){document.documentElement.dataset.theme=TH[ti];$('#thm').textContent='تم: '+TN[TH[ti]];try{localStorage.setItem('khth-v2',TH[ti])}catch(e){}}
$('#thm').onclick=()=>{ti=(ti+1)%3;setTh()};setTh();
$('#p-tpl').innerHTML='<p style="color:var(--mu)">فیلتر، واترمارک و قاب فعلی را به‌صورت یک قالب ذخیره کنید تا روی همه تصویرهای سایت یکسان اعمال شود (پردازش دسته‌ای هم از آن استفاده می‌کند).</p><label class="f">نام قالب<input type="text" id="tn" placeholder="مثلاً درسنامه"></label><button class="btn pri" id="ts">ذخیره قالب فعلی</button><h3>قالب‌های ذخیره‌شده</h3><div id="tl"></div>';
const TP=()=>{try{return JSON.parse(localStorage.getItem('khtpl')||'[]')}catch(e){return[]}};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function tplList(){$('#tl').innerHTML=TP().map((t,i)=>`<div class="tp"><span>${esc(t.n)}</span><button class="btn" data-ta="${i}">اعمال</button><button class="btn" data-td="${i}">حذف</button></div>`).join('')||'<p style="color:var(--mu)">هنوز قالبی ذخیره نشده.</p>'}
$('#ts').onclick=()=>{const n=$('#tn').value.trim()||('قالب '+(TP().length+1)),l=TP();l.push({n,S:{...S},W:{...W,img:null},F:{...F}});try{localStorage.setItem('khtpl',JSON.stringify(l))}catch(e){toast('ذخیره قالب ممکن نشد (حجم لوگو زیاد است)');return}$('#tn').value='';tplList();toast('قالب ذخیره شد')};
$('#tl').onclick=e=>{const l=TP(),a=e.target.dataset.ta,d=e.target.dataset.td;
 if(d!=null){l.splice(+d,1);localStorage.setItem('khtpl',JSON.stringify(l));tplList()}
 else if(a!=null){const t=l[+a];Object.assign(S,S0,t.S);Object.assign(F,F0,t.F);Object.assign(W,t.W,{img:W.img});if(t.W.imgData){const i=new Image();i.onload=()=>{W.img=i;render()};i.src=t.W.imgData}sync();saveWM();fit();toast('قالب اعمال شد')}};
tplList();
sync();setTool('none');
document.fonts&&document.fonts.load('700 20px Vazirmatn').then(()=>render());
</script>
